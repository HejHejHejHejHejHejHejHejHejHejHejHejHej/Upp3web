<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Semantic Elements</title>
    <style>
                body{
            margin: 0;
            background-color: rgb(113, 74, 74);
        }
        ul {
            display: flex;
            list-style: none;
            gap: 1.5rem;
        }
        span{
            font-weight: bold;¨
        }
        header{
            display: flex;
            align-items: center;

            background-color: rgb(0, 0, 0);
            color: white;
            justify-content: space-between;
            padding: 0.4rem 1rem;

        }
        main{
            text-align: center;
        }
        footer{
            background-color: rgb(150, 135, 135);
            padding:1rem;
        }
        h1, h2, h3 {
            font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif
            
        }
        h1 {
            font-size: 2.5rem ;
            text-decoration: underline;
            text-decoration-style: wavy;
            text-decoration-thickness:0.15rem ;
        }
        h2 {
            font-size: 1.78rem ;
        }
        h3{
            font-weight: 625 ;
            font-size: 1.3rem ;
            
        }
    </style>


</head>
<body>
    <header>
        <span>Semantiska element</span>

        <nav>
            <ul>
                <li>Hem</li>
                <li>Grundlägande element</li>
                <li>Om Mig</li>
                <li>Hjälp</li>
            </ul>
        </nav>


    </header>
    <main>
        <h1>Demon Bluff</h1>
        <h2>Characters</h2>
        <h3>Villagers</h3>
        <p>I don't have time to write this text.</p>
        <h3>Outcasts</h3>
        <p> Or this one.</p>
        <h3>Evils</h3>
        <p>And certenly not this one.</p>
        <h2>Game Mechanics</h2>
        <h3>Use your <span>imagenation</span></h3>

    </main>
    <footer>
        <span>Nosferatu</span>   
    </footer>

</body>
</html>
